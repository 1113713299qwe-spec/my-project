<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>致敬张雪峰老师｜五分钟纪念短片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">雪</span><div><strong>致敬 · 张雪峰老师</strong><small>一场持续讲述的原创人物动画</small></div></div>
      <div class="duration"><span>原创纪念短片</span><strong>05:00</strong></div>
    </header>

    <section class="stage-wrap" aria-label="视频播放器">
      <canvas id="film" width="1920" height="1080"></canvas>
      <button id="centerPlay" class="center-play" aria-label="播放">▶</button>
      <div id="chapterBadge" class="chapter-badge">序章</div>
    </section>

    <section class="controls">
      <button id="playBtn" class="icon-btn" aria-label="播放或暂停">▶</button>
      <div class="timeline-wrap">
        <input id="timeline" type="range" min="0" max="300" value="0" step="0.01" aria-label="视频进度">
        <div class="time-row"><span id="currentTime">00:00</span><span id="chapterName">序章 · 因为有人愿意把话讲明白</span><span>05:00</span></div>
      </div>
      <button id="muteBtn" class="text-btn">音乐 开</button>
      <button id="fullscreenBtn" class="text-btn">全屏</button>
    </section>

    <section class="details">
      <div><p class="eyebrow">A FIVE-MINUTE TRIBUTE</p><h1>愿每一次真诚的讲解，<br><em>都成为年轻人的一束光。</em></h1></div>
      <div class="actions">
        <button id="restartBtn" class="secondary">从头播放</button>
        <button id="exportBtn" class="primary">导出 WebM 视频</button>
      </div>
    </section>

    <section class="chapters" aria-label="章节列表">
      <h2>影片章节</h2>
      <div id="chapterList" class="chapter-grid"></div>
    </section>

    <footer><span>谨以此片，致敬认真回答每一个问题的人</span><span>2026 · 原创纪念作品</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
